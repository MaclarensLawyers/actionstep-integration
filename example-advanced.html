<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actionstep - Advanced Example</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-badge.connected {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.disconnected {
            background: #f8d7da;
            color: #721c24;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .stat:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
        }

        .stat-value {
            color: #333;
            font-size: 20px;
            font-weight: 600;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        button.secondary {
            background: #6c757d;
        }

        button.secondary:hover {
            background: #5a6268;
        }

        .search-box {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .item-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .item {
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .item:hover {
            background: #f8f9fa;
            border-color: #667eea;
        }

        .item-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .item-subtitle {
            font-size: 13px;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 15px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Actionstep Dashboard</h1>
            <div id="statusBadge" class="status-badge disconnected">Connecting...</div>
        </div>

        <div class="grid">
            <!-- Statistics Card -->
            <div class="card">
                <h2>📊 Statistics</h2>
                <div class="stat">
                    <span class="stat-label">Total Matters</span>
                    <span class="stat-value" id="totalMatters">-</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Open Matters</span>
                    <span class="stat-value" id="openMatters">-</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Total Contacts</span>
                    <span class="stat-value" id="totalContacts">-</span>
                </div>
                <div class="button-group">
                    <button onclick="loadDashboard()">Refresh Stats</button>
                </div>
            </div>

            <!-- Quick Actions Card -->
            <div class="card">
                <h2>⚡ Quick Actions</h2>
                <div class="button-group" style="flex-direction: column;">
                    <button onclick="showRecentMatters()">📁 Recent Matters</button>
                    <button onclick="showRecentContacts()">👥 Recent Contacts</button>
                    <button onclick="showMyTasks()">✅ My Tasks</button>
                    <button class="secondary" onclick="testConnection()">🔧 Test API</button>
                </div>
            </div>
        </div>

        <!-- Search Card -->
        <div class="card">
            <h2>🔍 Matter Lookup</h2>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input type="text" 
                       id="matterLookupInput"
                       class="search-box" 
                       style="margin-bottom: 0;"
                       placeholder="Enter Matter ID (e.g., 202660757)"
                       onkeypress="if(event.key==='Enter') lookupMatterById()">
                <button onclick="lookupMatterById()" style="min-width: 100px;">Lookup</button>
            </div>
            <h2 style="margin-top: 20px;">🔍 Search</h2>
            <input type="text" 
                   class="search-box" 
                   id="searchInput" 
                   placeholder="Search matters by name or reference..."
                   onkeyup="handleSearch(event)">
            <div id="searchResults"></div>
        </div>

        <!-- Results Card -->
        <div class="card">
            <h2 id="resultsTitle">📋 Results</h2>
            <div id="results">
                <div class="empty-state">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    <p>Click an action above to view data</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Simple ActionstepClient (inline for this example)
        class ActionstepClient {
            constructor() {
                this.parentOrigin = 'https://ap-southeast-2.actionstep.com';
                this.pendingRequests = new Map();
                this.connected = false;
                this.init();
            }

            init() {
                window.addEventListener('message', this.handleMessage.bind(this));
                setTimeout(() => {
                    window.parent.postMessage({ type: 'IFRAME_READY' }, this.parentOrigin);
                }, 500);
            }

            handleMessage(event) {
                if (!event.origin.includes('actionstep.com')) return;

                const { type, requestId, data, error } = event.data;

                if (type === 'CONNECTION_READY') {
                    this.connected = true;
                    updateConnectionStatus(true);
                } else if (type === 'API_RESPONSE') {
                    const resolver = this.pendingRequests.get(requestId);
                    if (resolver) {
                        error ? resolver.reject(new Error(error)) : resolver.resolve(data);
                        this.pendingRequests.delete(requestId);
                    }
                }
            }

            async apiRequest(endpoint, options = {}) {
                if (!this.connected) throw new Error('Not connected');

                const requestId = `req_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;

                return new Promise((resolve, reject) => {
                    this.pendingRequests.set(requestId, { resolve, reject });

                    setTimeout(() => {
                        this.pendingRequests.delete(requestId);
                        reject(new Error('Timeout'));
                    }, 30000);

                    window.parent.postMessage({
                        type: 'API_REQUEST',
                        requestId,
                        endpoint,
                        options
                    }, this.parentOrigin);
                });
            }
        }

        const client = new ActionstepClient();

        function updateConnectionStatus(connected) {
            const badge = document.getElementById('statusBadge');
            badge.textContent = connected ? '● Connected' : '● Disconnected';
            badge.className = `status-badge ${connected ? 'connected' : 'disconnected'}`;
        }

        function showLoading(containerId = 'results') {
            document.getElementById(containerId).innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <div>Loading...</div>
                </div>
            `;
        }

        async function loadDashboard() {
            try {
                showLoading('results');
                
                const [matters, contacts] = await Promise.all([
                    client.apiRequest('api/rest/actions?page[size]=100', { method: 'GET' }),
                    client.apiRequest('api/rest/participants?page[size]=100', { method: 'GET' })
                ]);

                const openMatters = matters.actions?.filter(m => m.status === 'open').length || 0;
                
                document.getElementById('totalMatters').textContent = matters.actions?.length || 0;
                document.getElementById('openMatters').textContent = openMatters;
                document.getElementById('totalContacts').textContent = contacts.participants?.length || 0;

                document.getElementById('results').innerHTML = '<p style="text-align:center;color:#28a745;padding:40px;">✅ Dashboard loaded successfully!</p>';
            } catch (error) {
                document.getElementById('results').innerHTML = `<p style="color:#dc3545;padding:20px;">Error: ${error.message}</p>`;
            }
        }

        async function showRecentMatters() {
            document.getElementById('resultsTitle').textContent = '📁 Recent Matters';
            showLoading();
            
            try {
                const data = await client.apiRequest('api/rest/actions?page[size]=20&sort=-id', { method: 'GET' });
                displayItems(data.actions, 'matter');
            } catch (error) {
                showError(error.message);
            }
        }

        async function showRecentContacts() {
            document.getElementById('resultsTitle').textContent = '👥 Recent Contacts';
            showLoading();
            
            try {
                const data = await client.apiRequest('api/rest/participants?page[size]=20&sort=-id', { method: 'GET' });
                displayItems(data.participants, 'contact');
            } catch (error) {
                showError(error.message);
            }
        }

        async function showMyTasks() {
            document.getElementById('resultsTitle').textContent = '✅ My Tasks';
            showLoading();
            
            try {
                const data = await client.apiRequest('api/rest/actionsteptasks?page[size]=20', { method: 'GET' });
                displayItems(data.actionsteptasks, 'task');
            } catch (error) {
                showError(error.message);
            }
        }

        function displayItems(items, type) {
            if (!items || items.length === 0) {
                document.getElementById('results').innerHTML = '<p style="text-align:center;color:#999;padding:40px;">No items found</p>';
                return;
            }

            let html = '<div class="item-list">';
            items.forEach(item => {
                if (type === 'matter') {
                    html += `
                        <div class="item">
                            <div class="item-title">${item.name || 'Untitled'}</div>
                            <div class="item-subtitle">ID: ${item.id} | Ref: ${item.reference || 'N/A'} | Status: ${item.status || 'N/A'}</div>
                        </div>
                    `;
                } else if (type === 'contact') {
                    html += `
                        <div class="item">
                            <div class="item-title">${item.firstName || ''} ${item.lastName || ''} ${item.companyName || ''}</div>
                            <div class="item-subtitle">ID: ${item.id} | ${item.email || 'No email'}</div>
                        </div>
                    `;
                } else if (type === 'task') {
                    html += `
                        <div class="item">
                            <div class="item-title">${item.name || 'Untitled Task'}</div>
                            <div class="item-subtitle">Status: ${item.status || 'N/A'} | Due: ${item.dueDate || 'N/A'}</div>
                        </div>
                    `;
                }
            });
            html += '</div>';
            document.getElementById('results').innerHTML = html;
        }

        function showError(message) {
            document.getElementById('results').innerHTML = `<p style="color:#dc3545;padding:20px;">❌ Error: ${message}</p>`;
        }

        async function testConnection() {
            document.getElementById('resultsTitle').textContent = '🔧 Connection Test';
            showLoading();
            
            try {
                const data = await client.apiRequest('api/rest/actions?page[size]=1', { method: 'GET' });
                document.getElementById('results').innerHTML = `
                    <div style="padding:20px;">
                        <p style="color:#28a745;margin-bottom:15px;">✅ Connection successful!</p>
                        <pre style="background:#f4f4f4;padding:15px;border-radius:6px;overflow-x:auto;">${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                showError(error.message);
            }
        }

        let searchTimeout;
        function handleSearch(event) {
            clearTimeout(searchTimeout);
            const query = event.target.value.trim();
            
            if (query.length < 2) {
                document.getElementById('searchResults').innerHTML = '';
                return;
            }

            searchTimeout = setTimeout(async () => {
                document.getElementById('searchResults').innerHTML = '<p style="color:#666;padding:10px;">Searching...</p>';
                
                try {
                    const data = await client.apiRequest(`api/rest/actions?filter[name]=${encodeURIComponent(query)}&page[size]=10`, { method: 'GET' });
                    
                    if (!data.actions || data.actions.length === 0) {
                        document.getElementById('searchResults').innerHTML = '<p style="color:#999;padding:10px;">No results found</p>';
                        return;
                    }

                    let html = '<div class="item-list" style="max-height:300px;">';
                    data.actions.forEach(matter => {
                        html += `
                            <div class="item" onclick="showMatterDetails(${matter.id})">
                                <div class="item-title">${matter.name}</div>
                                <div class="item-subtitle">Ref: ${matter.reference || 'N/A'}</div>
                            </div>
                        `;
                    });
                    html += '</div>';
                    document.getElementById('searchResults').innerHTML = html;
                } catch (error) {
                    document.getElementById('searchResults').innerHTML = `<p style="color:#dc3545;padding:10px;">Error: ${error.message}</p>`;
                }
            }, 500);
        }

        async function showMatterDetails(matterId) {
            document.getElementById('resultsTitle').textContent = `📁 Matter #${matterId}`;
            showLoading();
            
            try {
                const data = await client.apiRequest(`api/rest/actions/${matterId}`, { method: 'GET' });
                const matter = data.actions[0];
                
                document.getElementById('results').innerHTML = `
                    <div style="padding:20px;">
                        <h3 style="margin-bottom:15px;">${matter.name}</h3>
                        <div class="stat">
                            <span class="stat-label">ID</span>
                            <span class="stat-value">${matter.id}</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Reference</span>
                            <span class="stat-value">${matter.reference || 'N/A'}</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Status</span>
                            <span class="stat-value">${matter.status || 'N/A'}</span>
                        </div>
                        <pre style="margin-top:20px;background:#f4f4f4;padding:15px;border-radius:6px;overflow-x:auto;max-height:400px;">${JSON.stringify(matter, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                showError(error.message);
            }
        }

        async function lookupMatterById() {
            const matterId = document.getElementById('matterLookupInput').value.trim();
            
            if (!matterId) {
                showError('Please enter a Matter ID');
                return;
            }
            
            if (!/^\d+$/.test(matterId)) {
                showError('Matter ID must be a number');
                return;
            }
            
            await showMatterDetails(matterId);
        }

        // Auto-load dashboard when connected
        window.addEventListener('message', (event) => {
            if (event.data.type === 'CONNECTION_READY') {
                setTimeout(loadDashboard, 1000);
            }
        });
    </script>
</body>
</html>
